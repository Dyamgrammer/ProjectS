<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Button Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .phone-number {
            display: inline-block;
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            text-decoration: none;
            padding: 15px 25px;
            border: 2px solid #007bff;
            border-radius: 10px;
        }

        .phone-number:hover {
            background: #007bff;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Angela testing</h1>

    <p>Tap the number below to call:</p>

    <a href="tel:+639999698301" class="phone-number">
        0999-969-8301
    </a>

</body>
</html>
